[assistant]
name = "Yuki"
language = "pt-BR"

[llm]
base_url = "http://127.0.0.1:8080/v1"
model = "Qwen/Qwen3-1.7B-GGUF:Q8_0"
# Opção multimodal recomendada para o setup atual:
# model = "Qwen/Qwen3-VL-2B-Instruct-GGUF:Q4_K_M"
context_size = 4096
thinking = false
timeout_seconds = 60
max_tokens = 256
runtime_mode = "external"
server_binary = "llama-server"
model_source = "hf"
model_path = ""
startup_timeout_seconds = 120
shutdown_timeout_seconds = 5
gpu_layers = 99
device = ""
jinja = true
require_tool_support = true

[conversation]
# Contexto apenas em RAM; nao persiste apos fechar o app.
enabled = true
max_turns = 8
max_estimated_tokens = 2048

[context]
enabled = true
soft_limit_ratio = 0.82
recent_turns = 3
summary_max_estimated_tokens = 384
max_tool_result_estimated_tokens = 512
prune_tool_schemas = true

[tts]
engine = "kokoro"
language = "pt-BR"
lang_code = "p"
voice = "pf_dora"
speed = 1.0
mode = "resident"
keep_alive_seconds = 60
python = ".venv-kokoro/bin/python"

[performance]
memory_pressure_threshold = 0.85

[debug]
perception = false

[audio]
input_device = "default"
output_device = "default"
max_recording_seconds = 30.0

[wake]
enabled = false
backend = "openwakeword"
model = "hey jarvis"
threshold = 0.5
cooldown_seconds = 2.0
pre_roll_ms = 400

[vad]
speech_start_timeout_seconds = 5.0
end_silence_seconds = 0.8
max_utterance_seconds = 15.0
min_speech_seconds = 0.25
energy_threshold = 500

[vision]
enabled = false
capture_policy = "explicit"
max_capture_dimension = 1920
# 0 não grava capturas; o máximo permitido é 1800 segundos.
retention_seconds = 0.0

[stt]
enabled = true
engine = "whisper.cpp"
binary = "whisper-cli"
model_path = "models/whisper/ggml-small.bin"
language = "pt"
threads = 4
timeout_seconds = 30.0
initial_prompt = "Yuki é uma assistente de computador. Termos comuns: memória RAM, CPU, GPU, processos, megabytes, gigabytes, Firefox, Discord, Spotify e VS Code."

# Exemplos: altere ou remova conforme os aplicativos instalados.
[applications.firefox]
name = "Firefox"
command = ["firefox"]
process_names = ["firefox", "firefox.exe"]

[applications.discord]
name = "Discord"
command = ["discord"]
process_names = ["discord", "discord.exe"]

[applications.spotify]
name = "Spotify"
command = ["spotify"]
process_names = ["spotify", "spotify.exe"]

[applications.vscode]
name = "Visual Studio Code"
command = ["code"]
process_names = ["code", "code.exe"]
