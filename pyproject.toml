[project]
name = "jarvis-local"
version = "0.1.0"
description = "Local desktop assistant foundation"
readme = "README.md"
authors = [
    { name = "Konazin", email = "m4caun4@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "psutil>=7.2.2",
    "pyside6>=6.11.2",
    "sounddevice>=0.5.6",
]

[project.scripts]
jarvis-local = "jarvis_local:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.12.0",
]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = ["tests/manual"]

[tool.ruff.lint]
select = ["E", "F", "I"]
